<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Site manager</title>
<meta name="description" content="Sign in to manage portfolio projects and inbox.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-body admin-login-page">
<main class="admin-login-shell">
  <section class="admin-login-card" aria-labelledby="loginTitle">
    <div class="login-head">
      <span class="login-mark">S</span>
      <div><b>Site manager</b><small>sipun das · portfolio</small></div>
      <span class="login-secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>private</span>
    </div>
    <h1 id="loginTitle">Sign in</h1>
    <p class="admin-login-intro">Enter your admin key to manage projects, featured work and inbox enquiries.</p>
    <form id="loginForm" class="admin-login-form" novalidate>
      <label for="adminKey">Admin key</label>
      <div class="key-wrap">
        <input id="adminKey" type="password" autocomplete="current-password" placeholder="••••••••••••" required>
        <button type="button" id="keyToggle" aria-label="Show admin key">Show</button>
      </div>
      <p class="login-error" id="loginHint" role="alert"></p>
      <button class="cta-button login-submit" type="submit"><span>Sign in to dashboard</span><span aria-hidden="true">→</span></button>
    </form>
    <div class="login-foot">
      <span id="loginApi">checking backend…</span>
      <a class="admin-login-back" href="index.html">← Back to portfolio</a>
    </div>
  </section>
  <p class="login-note">Keys are set in <code>backend/.env</code> → <code>ADMIN_KEY</code>. This page is hidden from search engines.</p>
</main>
<script>
const form = document.getElementById('loginForm');
const keyInput = document.getElementById('adminKey');
const hint = document.getElementById('loginHint');
const keyToggle = document.getElementById('keyToggle');
const loginApi = document.getElementById('loginApi');
const isLocalDev = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:';
const api = localStorage.getItem('api_base') || (isLocalDev ? 'http://localhost:5000' : location.origin);
loginApi.textContent = 'backend · ' + api;
if (sessionStorage.getItem('admin_key')) window.location.replace('admin.html');
keyToggle.addEventListener('click', () => {
  const show = keyInput.type === 'password';
  keyInput.type = show ? 'text' : 'password';
  keyToggle.textContent = show ? 'Hide' : 'Show';
  keyInput.focus();
});
function fail(msg) {
  hint.textContent = msg;
  hint.classList.add('show');
  const button = form.querySelector('.login-submit');
  button.disabled = false;
  button.innerHTML = '<span>Sign in to dashboard</span><span aria-hidden="true">→</span>';
}
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const key = keyInput.value.trim();
  if (!key) { fail('Enter your admin key first.'); return; }
  const button = form.querySelector('.login-submit');
  button.disabled = true;
  button.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>Verifying…</span>';
  hint.textContent = '';
  hint.classList.remove('show');
  try {
    const response = await fetch(api + '/api/stats', { headers: { 'x-admin-key': key } });
    if (response.status === 401) throw new Error('Incorrect key. Check ADMIN_KEY in backend/.env.');
    if (!response.ok) throw new Error('Backend error (HTTP ' + response.status + ').');
    sessionStorage.setItem('admin_key', key);
    window.location.replace('admin.html');
  } catch (error) {
    fail(/Failed to fetch|NetworkError/i.test(error.message)
      ? 'Cannot reach the backend at ' + api + ' — start it with: cd backend, npm run dev.'
      : error.message);
  }
});
</script>
</body>
</html>
